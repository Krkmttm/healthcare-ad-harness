<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヘルスケア広告 自己採点ハーネス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#2563F4;--brand-50:#EEF3FE;--brand-100:#D6E2FD;--ink:#0F172A;--sub:#475569;--muted:#94A3B8;--line:#E2E8F0;--bg:#F7F9FC;--ok:#0E8A4F;--ok-50:#E7F6EE;--ng:#C62828;--ng-50:#FDECEC;
font-family:"Inter","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-size:14px;line-height:1.6}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:12px}
header .dot{width:12px;height:12px;border-radius:3px;background:var(--brand)}
header h1{font-size:18px;margin:0;font-weight:600}
header p{margin:0 0 0 auto;color:var(--sub);font-size:12px}
main{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px 24px;align-items:start}
@media(max-width:960px){main{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:14px;margin:0 0 6px;font-weight:600}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
textarea,input[type=number],input[type=text]{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea:focus,input:focus{outline:2px solid var(--brand-100);border-color:var(--brand)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px}
.btn{display:block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.btn:disabled{background:var(--muted);cursor:default}
.sbtn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.sbtn:disabled{opacity:.5;cursor:default}
#log{margin-top:12px;font-size:12px;color:var(--sub);max-height:160px;overflow:auto}
#log div{padding:2px 0;border-bottom:1px dashed var(--line)}
#log .err{color:var(--ng)}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.refs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.drop{border:1.5px dashed var(--brand-100);border-radius:8px;padding:10px;text-align:center;font-size:12px;color:var(--sub);cursor:pointer;background:var(--brand-50)}
.drop.on{border-color:var(--brand)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.summary{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.big{display:flex;align-items:baseline;gap:10px;font-weight:700}
.big .b{font-size:40px;color:var(--muted)}
.big .a{font-size:40px;color:var(--brand)}
.big .arrow{font-size:22px;color:var(--sub)}
.big small{font-size:12px;color:var(--sub);font-weight:500;display:block}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:56px 1fr 40px;gap:8px;align-items:center;font-size:12px;color:var(--sub)}
.bar .t{height:14px;background:var(--brand-50);border-radius:4px;position:relative;overflow:hidden}
.bar .f{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:4px;transition:width .6s}
.bar .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.35}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.slot{margin-top:16px}
.slot h3{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:600}
.track{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:stretch}
.sep{align-self:center;color:var(--muted);font-size:18px;flex:none}
.card{flex:none;width:320px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card.pass{border-color:var(--ok)}
.card.wait{border-color:var(--brand)}
.card .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--brand-50);color:var(--brand)}
.pill.ok{background:var(--ok-50);color:var(--ok)}
.pill.ng{background:var(--ng-50);color:var(--ng)}
.intent{font-size:12px;color:var(--sub)}
.ip{font-size:11.5px;color:var(--ink);background:var(--bg);border-radius:6px;padding:8px;font-family:ui-monospace,Menlo,monospace;line-height:1.5;max-height:120px;overflow:auto;white-space:pre-wrap}
.iprow{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.gen{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.sc{display:flex;flex-direction:column;gap:6px}
.sc .ax{display:grid;grid-template-columns:110px 1fr 24px;gap:6px;align-items:center;font-size:12px}
.sc .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.sc .f{height:100%;border-radius:4px}
.sc .n{text-align:right;font-weight:700}
.sc .r{grid-column:1/-1;font-size:11px;color:var(--sub);margin:-2px 0 2px}
.vf{font-size:11px}
.vf .e{color:var(--ng)}
.vf .o{color:var(--ok)}
.busy{font-size:12px;color:var(--brand);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>ヘルスケア広告 自己採点ハーネス</h1>
  <p>プロンプト → 画像 → 採点 → 検証 → 作り直し</p>
</header>
<main>
  <section class="panel">
    <h2>1. 依頼</h2>
    <label for="product">商品の概要</label>
    <textarea id="product" rows="4">ねむログ：スマートウォッチの睡眠データをもとに、AIが毎朝ひとつだけ「今日できる生活のヒント」を届けるアプリ。30〜40代の忙しく働く人向け。医療機器ではなく、日々のセルフケアを支えるサービス。</textarea>
    <label for="tone">ブランドのトーン</label>
    <input id="tone" type="text" value="誠実・やさしい・押しつけない">

    <label>お手本画像（イメージに近いもの・2〜3枚）</label>
    <div class="drop" id="refDrop">クリックして選ぶ／ドラッグ／貼り付け</div>
    <input type="file" id="refFile" accept="image/*" multiple hidden>
    <div class="refs" id="refs"></div>

    <div class="row3">
      <div><label for="n">案の数</label><input id="n" type="number" min="1" max="3" value="2"></div>
      <div><label for="th">合格ライン</label><input id="th" type="number" min="1" max="10" value="7"></div>
      <div><label for="rounds">最大周回</label><input id="rounds" type="number" min="1" max="5" value="3"></div>
    </div>
    <p class="hint">最大周回＝ガードレール。この回数で終わらなければ止めます。</p>

    <details open>
      <summary>採点基準（採点係に渡す）</summary>
      <label for="r1">ヘルスケアらしさ</label>
      <textarea id="r1" rows="4">10点: 心拍の波形、分子のような六角形、白衣や聴診器など、医療・健康を連想させるモチーフがあり、清潔で信頼感がある。
5点: 青くて清潔だが、医療・健康とのつながりが弱い。
1点: 医療・健康と結びつかない（雑貨、食卓、日用品、生活の場面の写真など）。</textarea>
      <label for="r2">テクノロジー感（AIらしさ）</label>
      <textarea id="r2" rows="4">10点: 点と線のネットワーク、六角形やドットのパターン、光の粒やボケ、やわらかな発光などで、データやAIを上品に感じさせる。
5点: テクノロジー感が弱い、または表現が雑で安っぽい。
1点: テクノロジー要素がない。またはサイバーパンクのように多色でギラギラしている。不自然な手や崩れた文字がある。</textarea>
      <label for="r3">ブランド・背景としての使いやすさ</label>
      <textarea id="r3" rows="4">10点: ブランドカラー #2563F4 を軸にした青のモノトーン（紺〜水色のグラデーション可）。文字を載せられる広い余白があり、お手本画像と雰囲気が近い。
5点: 青だが色味がずれている、または余白が足りない。
1点: 青以外の色が目立つ。画面全体がごちゃごちゃして文字が載らない。生活感のある写真。</textarea>
    </details>

    <details>
      <summary>検証ルール（プログラムで合否判定）</summary>
      <label for="brandHex">ブランド色</label>
      <input id="brandHex" type="text" value="#2563F4">
      <label for="avoid">プロンプトに入れない言葉（読点区切り）</label>
      <textarea id="avoid" rows="3">cyberpunk、rainbow、multicolor、robot、治る、必ず、絶対、100%、No.1</textarea>
      <p class="hint">プロンプトにブランド色が入っていること、ほかのカラーコードが入っていないことも確認します。</p>
    </details>

    <button id="run" class="btn" disabled>読み込み中…</button>
    <div id="log"></div>
  </section>

  <section>
    <div class="panel" id="sum"><div class="empty">
      ① 左でお手本画像を入れて「プロンプトをつくる」を押す<br>
      ② プロンプトをコピーして画像生成AIでつくる<br>
      ③ できた画像をカードに貼る（ドラッグ／クリック／Cmd+V）<br>
      → 採点され、不合格なら改善プロンプトが出ます
    </div></div>
    <div id="slots"></div>
  </section>
</main>
<input type="file" id="genFile" accept="image/*" hidden>

<script>
const $ = s => document.querySelector(s);
const AX = [["health","ヘルスケアらしさ","r1"],["nonai","テクノロジー感","r2"],["brand","ブランド・背景の使いやすさ","r3"]];
let sample = null, canImages = false;
let refs = [];
let state = { slots: {}, ids: [], th: 7, maxR: 3 };
let target = null;
let runId = 0;

function log(msg, cls){
  const d = document.createElement("div"); d.textContent = msg; if (cls) d.className = cls;
  const el = $("#log"); el.appendChild(d); el.scrollTop = el.scrollHeight;
}
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

(async () => {
  try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch(e){ sample = null; }
  const b = $("#run");
  if (!sample){ b.textContent = "このビューではAIを呼び出せません"; return; }
  try { const l = sample.limits ? await sample.limits() : null; canImages = !!(l && l.images); } catch(e){ canImages = false; }
  if (!canImages) log("このビューではAIに画像を見せられません。採点はできないので、別の開き方を試してください。", "err");
  b.disabled = false; b.textContent = "プロンプトをつくる";
  b.onclick = start;
})();

function toJpeg(file, max = 1024){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res({ blob: b, url: c.toDataURL("image/jpeg", .85) }), "image/jpeg", .85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error("画像を読み込めませんでした"));
    img.src = URL.createObjectURL(file);
  });
}

async function addRefs(files){
  for (const f of files){ if (!f.type.startsWith("image/")) continue; if (refs.length >= 3) break; refs.push(await toJpeg(f, 768)); }
  $("#refs").innerHTML = refs.map((r, i) => `<img src="${r.url}" title="クリックで削除" data-i="${i}">`).join("");
}
$("#refDrop").onclick = () => $("#refFile").click();
$("#refFile").onchange = e => { addRefs([...e.target.files]); e.target.value = ""; };
$("#refs").onclick = e => { const i = e.target.dataset.i; if (i !== undefined){ refs.splice(+i, 1); addRefs([]); } };
["dragover","dragenter"].forEach(t => $("#refDrop").addEventListener(t, e => { e.preventDefault(); $("#refDrop").classList.add("on"); }));
["dragleave","drop"].forEach(t => $("#refDrop").addEventListener(t, () => $("#refDrop").classList.remove("on")));
$("#refDrop").addEventListener("drop", e => { e.preventDefault(); addRefs([...e.dataTransfer.files]); });

document.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault();
  const w = waitingCards();
  if (w.length) attachImage(w[0].id, files[0]); else addRefs(files);
});

function parseJSON(t){
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  const s = m ? m[1] : t;
  return JSON.parse(s.slice(s.indexOf("{"), s.lastIndexOf("}") + 1));
}
async function askJSON(prompt, images){
  for (let i = 0; i < 2; i++){
    const opts = { modelTier: "default" };
    if (images && images.length) opts.images = images;
    const r = await sample(prompt, opts);
    try { return parseJSON(r.text); } catch(e){ if (i) throw new Error("AIの返答を読み取れませんでした"); }
  }
}
function errMsg(e){
  return e && e.code === "not_granted" ? "AIの呼び出しが許可されませんでした"
    : e && e.code === "rate_limited" ? "呼び出しが多すぎます。少し待ってください"
    : (e && e.message) || String(e);
}

function cfg(){
  return {
    product: $("#product").value.trim(), tone: $("#tone").value.trim(),
    n: Math.max(1, Math.min(3, +$("#n").value || 2)),
    th: +$("#th").value || 7, maxR: Math.max(1, Math.min(5, +$("#rounds").value || 3)),
    hex: ($("#brandHex").value.trim() || "#2563F4").toUpperCase(),
    avoid: $("#avoid").value.split(/[、,，\n]/).map(s => s.trim()).filter(Boolean),
    rubric: AX.map(([k, name, id]) => `[${k}] ${name}\n${$("#" + id).value.trim()}`).join("\n\n")
  };
}

function writerPrompt(c){
  return `あなたはヘルステック企業のアートディレクターです。次の商品の広告ビジュアル用に、画像生成AI向けの英語プロンプトを${c.n}案つくってください。
用途: 広告やLPの背景画像（上に文字を載せる）
ブランド: カラー ${c.hex}、トーン「${c.tone}」
商品: ${c.product}
idはA, B, C…の順に振ってください。intentは狙いを日本語30文字以内で。
JSONだけを出力してください: {"ideas":[{"id":"A","image_prompt":"","intent":""}]}`;
}

function scorerPrompt(c, prompt){
  const refNote = refs.length
    ? `添付画像のうち、最初の${refs.length}枚はデザイナーが選んだお手本画像、最後の1枚が採点対象の画像です。`
    : `添付画像は採点対象の画像です（お手本画像はありません）。`;
  return `あなたは厳しいクリエイティブディレクターです。案は作らず、採点だけをします。
${refNote}
下の採点基準だけに従い、採点対象の画像を1〜10の整数で採点してください。
厳しく採点するためのルール:
- 7点以上は「その項目について、お手本画像と同じ水準で、直すべき点がない」場合だけです。
- 理由に足りない点・弱い点を一つでも書くなら、その項目は6点以下にしてください。
- 「きれい」「無難」なだけの画像は5点です。ストックフォトのような画像は、ブランドの項目で5点以下です。
- 迷ったら低いほうの点にしてください。
理由は日本語30文字以内で、画像の何が足りないかを具体的に書いてください。

採点基準:
${c.rubric}

ブランドのトーン: ${c.tone}
商品: ${c.product}
この画像を生成したプロンプト: ${prompt}

JSONだけを出力してください:
{"scores":{"health":{"score":0,"reason":""},"nonai":{"score":0,"reason":""},"brand":{"score":0,"reason":""}}}`;
}

function rewritePrompt(c, v, fb){
  return `あなたはヘルステック企業のアートディレクターです。以下の画像プロンプトで生成した画像は、ディレクターの採点か検品で不合格でした。
指摘を踏まえて、画像生成AI向けのプロンプトを書き直してください。${refs.length ? "添付画像はデザイナーのお手本です。この雰囲気に近づけてください。" : ""}

守ること:
- 英語で書く
- ブランドカラー ${c.hex} を主役の色として必ず書き、ほかのカラーコードは書かない
- 次の言葉は使わない: ${c.avoid.join(", ")}
- ブランドのトーン「${c.tone}」
- 用途は広告やLPの背景画像（上に文字を載せる）

商品: ${c.product}
元のプロンプト: ${v.prompt}
指摘:
${fb.map(x => "- " + x).join("\n")}

JSONだけを出力してください: {"image_prompt":"","changes":"何を変えたかを日本語30文字以内で"}`;
}

function verify(c, p){
  const errs = [], P = (p || "");
  if (!P.toUpperCase().includes(c.hex)) errs.push(`プロンプトにブランド色${c.hex}がない`);
  const other = (P.match(/#[0-9A-Fa-f]{6}\b/g) || []).filter(h => h.toUpperCase() !== c.hex);
  if (other.length) errs.push(`ブランド外の色 ${[...new Set(other)].join(" ")}`);
  c.avoid.forEach(w => { if (P.toLowerCase().includes(w.toLowerCase())) errs.push(`使わない言葉「${w}」`); });
  return errs;
}

const avg = v => AX.reduce((s, [k]) => s + (v.scores?.[k]?.score || 0), 0) / AX.length;
const color = s => s >= state.th ? "var(--brand)" : s >= 5 ? "#E0A33A" : "var(--ng)";
function waitingCards(){ return state.ids.map(id => ({ id, v: state.slots[id].at(-1) })).filter(x => x.v.status === "wait"); }

async function start(){
  const c = cfg(); const b = $("#run");
  const my = ++runId;
  state = { slots: {}, ids: [], th: c.th, maxR: c.maxR, c };
  $("#log").innerHTML = ""; $("#slots").innerHTML = "";
  $("#sum").innerHTML = `<div class="empty">前の結果を消して、新しいプロンプトをつくっています…</div>`;
  try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch(e){}
  b.disabled = true; b.textContent = "プロンプトを作成中…";
  try {
    log(`1周目：プロンプトを${c.n}案つくっています…`);
    const g = await askJSON(writerPrompt(c));
    if (my !== runId) return;
    (g.ideas || []).slice(0, c.n).forEach((x, i) => {
      const id = String.fromCharCode(65 + i);
      state.ids.push(id);
      state.slots[id] = [{ round: 1, prompt: x.image_prompt || "", intent: x.intent || "", status: "wait" }];
    });
    log("プロンプトをコピーして画像をつくり、カードに貼ってください");
  } catch(e){ log("エラー：" + errMsg(e), "err"); }
  b.disabled = false; b.textContent = "最初からやり直す";
  render();
}

async function attachImage(id, file){
  const c = state.c; const v = state.slots[id].at(-1);
  if (!v || v.status !== "wait") return;
  try {
    const im = await toJpeg(file);
    v.image = im.url; v.blob = im.blob;
  } catch(e){ log("エラー：" + errMsg(e), "err"); return; }
  await evaluate(id, v);
}

async function evaluate(id, v){
  const c = cfg(); state.th = c.th; state.c = c;
  const my = runId;
  try {
    v.status = "scoring"; render();
    log(`案${id} ${v.round}周目：採点係が画像を採点中…`);
    const sc = await askJSON(scorerPrompt(c, v.prompt), [...refs.map(r => r.blob), v.blob]);
    v.scores = {};
    AX.forEach(([k]) => { const s = sc.scores?.[k] || {}; v.scores[k] = { score: Math.max(0, Math.min(10, Math.round(+s.score || 0))), reason: s.reason || "" }; });
    v.errs = verify(c, v.prompt);
    v.pass = AX.every(([k]) => v.scores[k].score >= c.th) && !v.errs.length;
    v.status = "done"; render();
    log(`案${id} ${v.round}周目：平均${avg(v).toFixed(1)}点・${v.pass ? "合格" : "不合格"}`);
    if (v.pass) return;
    if (state.slots[id].at(-1) !== v) return;
    if (v.round >= c.maxR){ log(`案${id}：ガードレール。${c.maxR}周に達したので停止`); return; }
    v.status = "rewriting"; render();
    log(`案${id}：改善プロンプトを作成中…`);
    const fb = AX.filter(([k]) => v.scores[k].score < c.th).map(([k, name]) => `${name} ${v.scores[k].score}点：${v.scores[k].reason}`)
      .concat(v.errs.map(e => `検品NG：${e}`));
    const rw = await askJSON(rewritePrompt(c, v, fb), refs.map(r => r.blob));
    v.status = "done";
    if (my !== runId) return;
    state.slots[id].push({ round: v.round + 1, prompt: rw.image_prompt || "", intent: rw.changes ? "変更点：" + rw.changes : "", status: "wait" });
    log(`案${id} ${v.round + 1}周目：改善プロンプトができました`);
  } catch(e){
    log("エラー：" + errMsg(e), "err");
    if (v.status === "scoring"){ if (v.scores) v.status = "done"; else { v.status = "wait"; v.image = null; } }
    if (v.status === "rewriting") v.status = "done";
  }
  render();
}

function render(){
  const ids = state.ids; if (!ids.length) return;
  const scored = ids.flatMap(id => state.slots[id].filter(v => v.scores));
  if (scored.length){
    const R = Math.max(...scored.map(v => v.round));
    const roundAvg = [];
    for (let r = 1; r <= R; r++){
      const vs = ids.map(id => state.slots[id].filter(v => v.scores && v.round <= r).at(-1)).filter(Boolean);
      roundAvg.push(vs.reduce((s, v) => s + avg(v), 0) / vs.length);
    }
    const bests = ids.map(id => state.slots[id].filter(v => v.scores).sort((a, b) => (b.pass - a.pass) || (avg(b) - avg(a)))[0]).filter(Boolean);
    const fin = bests.reduce((s, v) => s + avg(v), 0) / bests.length;
    $("#sum").innerHTML = `<div class="summary">
      <div class="big">
        <div><small>改善前（1周目）</small><span class="b">${roundAvg[0].toFixed(1)}</span></div>
        <span class="arrow">→</span>
        <div><small>いちばん良い版</small><span class="a">${fin.toFixed(1)}</span></div>
        <div><small>合格</small><span style="font-size:22px">${bests.filter(v => v.pass).length}/${ids.length}</span></div>
      </div>
      <div class="bars">
        ${roundAvg.map((a, i) => `<div class="bar"><span>${i + 1}周目</span><div class="t"><div class="f" style="width:${a * 10}%"></div><div class="th" style="left:${state.th * 10}%"></div></div><b style="color:var(--ink)">${a.toFixed(1)}</b></div>`).join("")}
        <div class="hint">平均点（3項目の平均・10点満点）。黒い線が合格ライン。</div>
      </div></div>`;
  } else {
    $("#sum").innerHTML = `<div class="empty">プロンプトをコピーして画像をつくり、青い枠のカードに貼ってください（ドラッグ／クリック／Cmd+V）</div>`;
  }
  $("#slots").innerHTML = ids.map(id => `<div class="slot"><h3>案${id}</h3><div class="track">
    ${state.slots[id].map((v, i) => (i ? `<span class="sep">→</span>` : "") + card(id, v, i)).join("")}
  </div></div>`).join("");
}

function card(id, v, i){
  const st = v.status === "wait" ? `<span class="pill">画像待ち</span>`
    : v.status === "scoring" ? `<span class="pill">採点中…</span>`
    : v.scores ? `<span class="pill ${v.pass ? "ok" : "ng"}">${v.pass ? "合格" : "不合格"}</span>` : "";
  let body = "";
  if (v.status === "wait"){
    body = `<div class="drop" data-drop="${id}">ここに画像をドラッグ／クリックして選ぶ<br>（Cmd+V で貼り付けも可）</div>`;
  } else if (v.image){
    body = `<img class="gen" src="${v.image}">`;
  }
  let sc = "";
  if (v.scores){
    sc = `<div class="sc">${AX.map(([k, name]) => { const s = v.scores[k]; return `
      <div class="ax"><span>${name}</span><div class="t"><div class="f" style="width:${s.score * 10}%;background:${color(s.score)}"></div></div><span class="n" style="color:${color(s.score)}">${s.score}</span>
      <div class="r">${esc(s.reason)}</div></div>`; }).join("")}</div>
      <div class="vf">${v.errs.length ? v.errs.map(e => `<div class="e">✕ ${esc(e)}</div>`).join("") : `<div class="o">✓ 検証OK（ブランド色・使わない言葉）</div>`}</div>`;
  }
  const busy = v.status === "rewriting" ? `<div class="busy">改善プロンプトを作成中…</div>`
    : (v.scores && v.status === "done") ? `<button class="sbtn" data-rescore="${id}:${i}">今の採点基準で再採点</button>` : "";
  return `<div class="card ${v.pass ? "pass" : ""} ${v.status === "wait" ? "wait" : ""}">
    <div class="top"><span>${v.round}周目${v.round === 1 ? "（改善前）" : "（作り直し）"}</span>${st}</div>
    ${v.intent ? `<div class="intent">${esc(v.intent)}</div>` : ""}
    <div class="iprow"><span>画像プロンプト</span><button class="sbtn" data-copy="${id}:${i}">コピー</button></div>
    <div class="ip">${esc(v.prompt)}</div>
    ${body}${sc}${busy}
  </div>`;
}

$("#slots").addEventListener("click", async e => {
  const cp = e.target.closest("[data-copy]");
  if (cp){
    const [id, i] = cp.dataset.copy.split(":");
    try { await navigator.clipboard.writeText(state.slots[id][+i].prompt); cp.textContent = "コピーしました"; }
    catch(err){ cp.textContent = "手動でコピーしてください"; }
    setTimeout(() => { cp.textContent = "コピー"; }, 1500);
    return;
  }
  const rs = e.target.closest("[data-rescore]");
  if (rs){
    const [id, i] = rs.dataset.rescore.split(":");
    const v = state.slots[id][+i];
    const prev = AX.map(([k]) => v.scores[k].score).join("/");
    log(`案${id} ${v.round}周目：再採点（前回 ${prev}）`);
    evaluate(id, v);
    return;
  }
  const d = e.target.closest("[data-drop]");
  if (d){ target = d.dataset.drop; $("#genFile").click(); }
});
$("#genFile").onchange = e => { const f = e.target.files[0]; if (f && target) attachImage(target, f); e.target.value = ""; };
$("#slots").addEventListener("dragover", e => { const d = e.target.closest("[data-drop]"); if (d){ e.preventDefault(); d.classList.add("on"); } });
$("#slots").addEventListener("dragleave", e => { const d = e.target.closest("[data-drop]"); if (d) d.classList.remove("on"); });
$("#slots").addEventListener("drop", e => {
  const d = e.target.closest("[data-drop]"); if (!d) return;
  e.preventDefault();
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith("image/"));
  if (f) attachImage(d.dataset.drop, f);
});
</script>
</body>
</html>
